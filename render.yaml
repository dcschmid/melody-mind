# Render Blueprint for MelodyMind Music
# https://render.com/docs/blueprint-spec
#
# MelodyMind is deployed as five independent static sites plus the Music embed.

services:
  - type: web
    name: melody-mind-music
    runtime: static
    buildCommand: pnpm install && pnpm build
    staticPublishPath: apps/music/dist
    buildFilter:
      paths:
        - apps/music/**
        - package.json
        - pnpm-lock.yaml
        - turbo.json
        - pnpm-workspace.yaml
        - render.yaml
    routes:
      - type: redirect
        source: /music/genre/*
        destination: /genre/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https://eu2.contabostorage.com blob:; connect-src 'self' https://eu2.contabostorage.com; frame-src 'self' https://embed.melody-mind.de; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
      # HTML (and anything not matched more specifically): always revalidate.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /player-queues/*
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /audio/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: melody-mind-embed
    runtime: static
    buildCommand: pnpm install && pnpm build:embed
    staticPublishPath: apps/music/dist-embed
    domains:
      - embed.melody-mind.de
    buildFilter:
      paths:
        - apps/music/**
        - package.json
        - pnpm-lock.yaml
        - turbo.json
        - pnpm-workspace.yaml
        - render.yaml
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: autoplay=(self), camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src https://eu2.contabostorage.com; connect-src 'none'; frame-src 'none'; frame-ancestors https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"

  - type: web
